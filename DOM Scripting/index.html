
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Tasks</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>My Daily Tasks</h1>
        <p class="subtitle">Plan your day, one task at a time!</p>

        <form id="taskForm">
            <label for="taskInput">Enter a task</label>
            <div class="input-group">
                <input type="text"
                       id="taskInput"
                       placeholder="e.g. Study JavaScript">
                <button type="submit">Add Task</button>
            </div>
            <p id="errorMessage" class="error" aria-live="polite"></p>
        </form>

        <section class="task-section">
            <h2>Your Tasks</h2>
            <p id="taskCount">You have 0 unfinished tasks.</p>
            <ul id="taskList"></ul>
        </section>
    </main>
</body>
</html>
